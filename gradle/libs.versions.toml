[versions]
agp = "8.10.0"
appcompatV7 = "28.0.0"
#requires androidx butterknife = "10.2.3"
butterknife = "8.4.0"
dagger = "2.56"
eventbus = "3.3.1"
arch = "1.1.1"
guava = "33.4.8-android"
materialdrawer = "2.9.8"
okhttp = "4.12.0"
socketIoClient = "2.1.2"
#junit = "4.13.2"
#junitVersion = "1.2.1"
#espressoCore = "3.6.1"
#appcompat = "1.6.1"
#material = "1.10.0"
#constraintlayout = "2.1.4"
#lifecycleLivedataKtx = "2.9.0"
#lifecycleViewmodelKtx = "2.9.0"
#navigationFragment = "2.6.0"
#navigationUi = "2.6.0"

[libraries]
appcompat-v7 = { module = "com.android.support:appcompat-v7", version.ref = "appcompatV7" }
cardview-v7 = { module = "com.android.support:cardview-v7", version.ref = "appcompatV7" }
design = { module = "com.android.support:design", version.ref = "appcompatV7" }
recyclerview-v7 = { module = "com.android.support:recyclerview-v7", version.ref = "appcompatV7" }
arch-extensions = { module = "android.arch.lifecycle:extensions", version.ref = "arch" }
arch-compiler = { module = "android.arch.lifecycle:compiler", version.ref = "arch" }
#appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
materialdrawer = { module = "com.mikepenz.materialdrawer:library", version.ref = "materialdrawer" }
socket-io-client = { module = "io.socket:socket.io-client", version.ref = "socketIoClient" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

butterknife = { module = "com.jakewharton:butterknife", version.ref = "butterknife" }
butterknife-compiler = { module = "com.jakewharton:butterknife-compiler", version.ref = "butterknife" }

#junit = { group = "junit", name = "junit", version.ref = "junit" }
#ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
#espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
#material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
#lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
#lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
#navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
#navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigationUi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

