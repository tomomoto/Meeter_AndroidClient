plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.tom.meeter'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.tom.meeter"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        /*
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        */
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        //LocalDateTime features
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }

    lint {
        // https://github.com/bumptech/glide/issues/4940
        lintConfig = file("android_google_firebase_lint_workaround.xml")
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation(
            [group: 'com.android.support', name: 'appcompat-v7', version: '27.0.1'],
            [group: 'com.android.support', name: 'recyclerview-v7', version: '27.0.0'],
            [group: 'com.android.support', name: 'design', version: '27.0.1'],
            [group: 'com.android.support', name: 'cardview-v7', version: '27.0.1']
    )

    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'org.greenrobot:eventbus:3.0.0'

    /*implementation 'com.google.android.gms:play-services:8.4.0'*/
    implementation 'com.google.android.gms:play-services:12.0.1'

    implementation('com.mikepenz.materialdrawer:library:0.9.5@aar') {
        transitive = true
    }

    implementation 'com.jakewharton:butterknife:8.4.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.4.0'
    /*
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    */

    implementation 'com.google.code.gson:gson:2.8.5'

    implementation(
            [group: 'io.reactivex.rxjava2', name: 'rxandroid', version: '2.1.1'],
            [group: 'io.reactivex.rxjava2', name: 'rxjava', version: '2.2.6']
    )


    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation(
            [group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.4.1'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.4.1'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.4.1']
    )

    /*implementation 'androidx.lifecycle:lifecycle-viewmodel:2.0.0'*/


    implementation 'android.arch.lifecycle:extensions:1.1.1'
    annotationProcessor 'android.arch.lifecycle:compiler:1.1.1'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'

    // Dagger 2
    implementation 'com.google.dagger:dagger:2.16'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.16'

    // Room
    implementation 'android.arch.persistence.room:runtime:1.1.1'
    implementation 'android.arch.persistence.room:rxjava2:1.1.1'
    annotationProcessor 'android.arch.persistence.room:compiler:1.1.1'
    /*
    implementation 'com.google.dagger:dagger:2.16'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.x'
    */

    testImplementation 'junit:junit:4.12'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    //LocalDateTime features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

}

