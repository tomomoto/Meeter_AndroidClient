plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tom.meeter'
    compileSdk 33

    defaultConfig {
        applicationId "com.tom.meeter"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        /*
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        */
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        //LocalDateTime features
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }

    lint {
        // https://github.com/bumptech/glide/issues/4940
        lintConfig = file("android_google_firebase_lint_workaround.xml")
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.recyclerview
    implementation libs.material
    implementation libs.cardview

    implementation libs.lifecycleextensions
    annotationProcessor libs.lifecyclecompiler

    implementation libs.socketioclient
    implementation libs.eventbus

/*    implementation 'com.google.android.gms:play-services:12.0.1'*/
    implementation("com.google.android.gms:play-services-maps:19.2.0")
//    implementation("com.google.android.gms:play-services-location:21.3.0")

    implementation libs.materialdrawer

    implementation libs.butterknife
    annotationProcessor libs.butterknifecompiler

    implementation 'com.google.code.gson:gson:2.8.5'

    implementation(
            [group: 'io.reactivex.rxjava2', name: 'rxandroid', version: '2.1.1'],
            [group: 'io.reactivex.rxjava2', name: 'rxjava', version: '2.2.6']
    )


    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation 'androidx.test:core:1.0.0'
    testImplementation libs.junit.jupiter
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.0'

    implementation libs.jackson.core
    implementation libs.jackson.annotations
    implementation libs.jackson.databind

    /*implementation 'androidx.lifecycle:lifecycle-viewmodel:2.0.0'*/

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'

    // Dagger 2
    implementation libs.dagger
    annotationProcessor libs.daggercompiler

    // Room
    implementation libs.roomruntime
    implementation libs.roomrxjava2
    annotationProcessor libs.roomcompiler

    implementation libs.okhttp

    //LocalDateTime features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation libs.guava

}

