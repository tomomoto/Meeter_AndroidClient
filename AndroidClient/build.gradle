plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tom.meeter'
    compileSdk 33

    defaultConfig {
        applicationId "com.tom.meeter"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        /*
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        */
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        //LocalDateTime features
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }

    lint {
        // https://github.com/bumptech/glide/issues/4940
        lintConfig = file("android_google_firebase_lint_workaround.xml")
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    //implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation libs.appcompat.v7
    implementation libs.recyclerview.v7
    implementation libs.design
    implementation libs.cardview.v7

    implementation libs.socket.io.client
    implementation libs.eventbus

    implementation 'com.google.android.gms:play-services:12.0.1'
    //need androidx to use p-s-l
    /*implementation("com.google.android.gms:play-services-location:21.3.0")*/

    implementation libs.materialdrawer

    implementation libs.butterknife
    annotationProcessor libs.butterknife.compiler

    implementation 'com.google.code.gson:gson:2.8.5'

    implementation(
            [group: 'io.reactivex.rxjava2', name: 'rxandroid', version: '2.1.1'],
            [group: 'io.reactivex.rxjava2', name: 'rxjava', version: '2.2.6']
    )


    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation(
            [group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.4.1'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.4.1'],
            [group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.4.1']
    )

    /*implementation 'androidx.lifecycle:lifecycle-viewmodel:2.0.0'*/


    implementation libs.arch.extensions
    annotationProcessor libs.arch.compiler

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'

    // Dagger 2
    implementation libs.dagger
    annotationProcessor libs.dagger.compiler

    // Room
    implementation 'android.arch.persistence.room:runtime:1.1.1'
    implementation 'android.arch.persistence.room:rxjava2:1.1.1'
    annotationProcessor 'android.arch.persistence.room:compiler:1.1.1'
    /*
    implementation 'com.google.dagger:dagger:2.16'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.x'
    */

    testImplementation 'junit:junit:4.12'

    implementation libs.okhttp

    //LocalDateTime features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation libs.guava

}

